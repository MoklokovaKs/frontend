<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Frontend v2.0</title>
</head>
<body>
    <h1>Frontend 2.0</h1>

    <h2>Отправить текст</h2>
    <input type="text" id="textInput" placeholder="Введите текст">
    <button id="sendBtn">Отправить</button>
    <p id="status"></p>

    <h2>Получить данные</h2>
    <input type="text" id="requestInput" placeholder="Запрос (необязательно)">
    <button id="getBtn">Получить</button>
    <br><textarea id="resultOutput" rows="6" cols="50" readonly></textarea>

    <script src="script.js"></script>
</body>
</html>
